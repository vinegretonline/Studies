name: opalikhovets-mod

on:
  push:
    paths:
      - 'opalikhovets-mod/**'
      - '.github/workflows/opalikhovets-mod.yml'
  pull_request:
    paths:
      - 'opalikhovets-mod/**'
      - '.github/workflows/opalikhovets-mod.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opalikhovets-mod
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Show latest NeoForge 21.1.x
        continue-on-error: true
        run: |
          set -o pipefail
          curl -fsSL https://maven.neoforged.net/api/maven/versions/releases/net/neoforged/neoforge \
            | grep -oE '"21\.1\.[0-9]+"' | tr -d '"' | sort -t. -k3 -n -u | tail -n 3

      - name: Build
        run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: opalikhovets-mod
          path: opalikhovets-mod/build/libs/*.jar
