name: opalikhovets-mod

on:
  push:
    paths:
      - 'opalikhovets-mod/**'
      - '.github/workflows/opalikhovets-mod.yml'
  pull_request:
    paths:
      - 'opalikhovets-mod/**'
      - '.github/workflows/opalikhovets-mod.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opalikhovets-mod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Show latest NeoForge 21.1.x
        run: curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -oE '21\.1\.[0-9]+' | sort -t. -k3 -n -u | tail -n 3

      - name: Build
        run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: opalikhovets-mod
          path: opalikhovets-mod/build/libs/*.jar
